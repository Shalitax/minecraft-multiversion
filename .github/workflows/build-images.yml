name: Build images

on:
  push:
    branches: [main, master]
    # Only rebuild when something that lands in the image actually changes.
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    paths:
      - 'images/**'
  # Monthly rebuild so the images pick up base-image security patches even
  # when this repo has not changed.
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags to build (empty = all)'
        required: false
        default: ''

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docker repository names must be lowercase, but a GitHub username may
  # contain uppercase letters and Actions expressions have no lowercase
  # function. Normalising once here keeps every job using the same name.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
      version: ${{ steps.stamp.outputs.version }}
      built: ${{ steps.stamp.outputs.built }}
    steps:
      - name: Build lowercase image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Every variant is a tag on ONE package, so visibility only has to be
          # set once.
          echo "image=ghcr.io/${owner}/minecraft-multiversion" >> "$GITHUB_OUTPUT"
          echo "Publishing to ghcr.io/${owner}/minecraft-multiversion"

      # A moving tag alone leaves no way back: republishing java_21 overwrites
      # the only copy. The dated tag below is never reused, so a bad release can
      # be rolled back by pointing the panel at the previous one.
      - name: Build version stamp
        id: stamp
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y%m%d)-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

  # Fail fast on a shell error before spending ~20 minutes of build time.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: |
          bash -n images/entrypoint.sh
          bash -n images/build.sh
          sh -n install.sh

      # The egg carries its own copy of install.sh, and that copy is the one
      # Pterodactyl actually runs. Editing only the file on disk changes
      # nothing in production, and the divergence is invisible in review
      # because the embedded copy is a single JSON-escaped line.
      - name: Egg matches install.sh
        run: |
          node -e '
            const fs = require("fs");
            const egg = JSON.parse(fs.readFileSync("egg-minecraft-multiversion.json", "utf8"));
            const embedded = egg.scripts.installation.script;
            const disk = fs.readFileSync("install.sh", "utf8").replace(/\r\n/g, "\n");
            if (embedded !== disk) {
              const a = embedded.split("\n"), b = disk.split("\n");
              // Walked rather than findIndex: when one side is simply longer,
              // every shared line matches and findIndex returns -1, which
              // printed "linea 0: undefined" and helped nobody.
              let i = 0;
              while (i < Math.max(a.length, b.length) && a[i] === b[i]) i++;
              console.error("El script embebido en el egg no coincide con install.sh.");
              console.error("Primera diferencia en la linea " + (i + 1) + ":");
              console.error("  egg : " + (i < a.length ? JSON.stringify(a[i]) : "(no existe, el egg tiene menos lineas)"));
              console.error("  disk: " + (i < b.length ? JSON.stringify(b[i]) : "(no existe, install.sh tiene menos lineas)"));
              console.error("Ejecuta ./sync-egg.sh para regenerarlo.");
              process.exit(1);
            }
            console.log("OK: el egg y install.sh coinciden (" + disk.length + " caracteres)");
          '

      # Catches a malformed egg before an admin discovers it at import time.
      - name: Validate egg structure
        run: |
          node -e '
            const egg = require("./egg-minecraft-multiversion.json");
            const fail = (m) => { console.error(m); process.exitCode = 1; };

            if (egg.meta?.version !== "PTDL_v2") fail("meta.version debe ser PTDL_v2");
            const images = Object.entries(egg.docker_images || {});
            if (!images.length) fail("docker_images esta vacio");
            for (const [k, v] of images) {
              if (/[A-Z]/.test(v)) fail(`imagen con mayusculas: ${k} -> ${v}`);
              if (v.includes("CHANGEME")) fail(`placeholder sin sustituir: ${k}`);
            }

            const seen = new Set();
            for (const v of egg.variables || []) {
              if (seen.has(v.env_variable)) fail(`variable duplicada: ${v.env_variable}`);
              seen.add(v.env_variable);
              if (!v.rules) fail(`${v.env_variable} no tiene rules`);
              const parts = String(v.rules).split("|");

              // A default that its own in: rule rejects makes every server fail
              // validation on the first save, before anyone changes anything.
              const inRule = parts.find((r) => r.startsWith("in:"));
              if (inRule) {
                const allowed = inRule.slice(3).split(",");
                if (!allowed.includes(String(v.default_value))) {
                  fail(`${v.env_variable}: default "${v.default_value}" no esta en su regla in:`);
                }
              }

              // Pterodactyl stores rules as one pipe-delimited string and hands
              // it to Laravel, which splits on "|" before parsing. A regex
              // containing "|" is therefore torn in half and silently stops
              // validating what it was written to validate.
              const rawRegex = String(v.rules).match(/regex:(.*)$/);
              if (rawRegex && parts.filter((r) => r.startsWith("regex:")).length) {
                const regexPart = parts.find((r) => r.startsWith("regex:")).slice(6);
                if (!regexPart.endsWith("/") || regexPart.length < 2) {
                  fail(`${v.env_variable}: la regla regex: parece cortada ("${regexPart}"). ` +
                       `Laravel separa por "|", asi que el patron no puede contener "|".`);
                } else {
                  // Same check the panel will run, against the declared default.
                  const body = regexPart.slice(1, -1);
                  if (!new RegExp(body).test(String(v.default_value))) {
                    fail(`${v.env_variable}: default "${v.default_value}" no pasa su propia regex`);
                  }
                }
              }
            }
            if (!process.exitCode) console.log(`OK: ${images.length} imagenes, ${seen.size} variables`);
          '

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Informational: style findings should not block a release.
          shellcheck -S error images/entrypoint.sh install.sh || true

  build:
    needs: [lint, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # IBM Semeru (OpenJ9) publishes no arm64 base image, so those
          # variants are amd64-only.
          - { tag: '8',    platforms: 'linux/amd64,linux/arm64' }
          - { tag: '8j9',  platforms: 'linux/amd64' }
          - { tag: '11',   platforms: 'linux/amd64,linux/arm64' }
          - { tag: '16',   platforms: 'linux/amd64,linux/arm64' }
          - { tag: '17',   platforms: 'linux/amd64,linux/arm64' }
          - { tag: '17j9', platforms: 'linux/amd64' }
          - { tag: '21',   platforms: 'linux/amd64,linux/arm64' }
          - { tag: '25',   platforms: 'linux/amd64,linux/arm64' }

    steps:
      - uses: actions/checkout@v4

      # Lets workflow_dispatch build a subset without editing the matrix.
      - name: Decide whether to build this tag
        id: filter
        run: |
          REQUESTED="${{ github.event.inputs.tags }}"
          if [ -z "${REQUESTED}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif echo " ${REQUESTED} " | grep -q " ${{ matrix.tag }} "; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ matrix.tag }} not requested, skipping."
          fi

      # Required to build arm64 on an amd64 runner.
      - name: Set up QEMU
        if: steps.filter.outputs.build == 'true' && contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.filter.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      # Pull requests build to verify, but must not publish.
      - name: Log in to GHCR
        if: steps.filter.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.filter.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          # Context is images/, so the Dockerfile's COPY entrypoint.sh resolves
          # against the directory the entrypoint actually lives in.
          context: ./images
          file: ./images/java/${{ matrix.tag }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          # Moving tag for the panel, plus an immutable dated one for rollback.
          tags: |
            ${{ needs.prepare.outputs.image }}:java_${{ matrix.tag }}
            ${{ needs.prepare.outputs.image }}:java_${{ matrix.tag }}-${{ needs.prepare.outputs.version }}
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.built }}
            BUILD_REF=${{ needs.prepare.outputs.version }}
          # Links the GHCR package back to this repository, so it inherits the
          # repo's access settings and shows a source link on the package page.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=java_${{ matrix.tag }}
          cache-to: type=gha,scope=java_${{ matrix.tag }},mode=max

  # Prints the exact docker_images block to paste into the egg, with the
  # namespace already filled in.
  summary:
    needs: [build, prepare]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Report published images
        run: |
          {
            echo "## Images published"
            echo
            echo 'Package: `${{ needs.prepare.outputs.image }}` (8 tags on one package)'
            echo
            echo '> If this package is new, set it to **Public** once:'
            echo '> Profile → Packages → minecraft-multiversion → Package settings → Change visibility.'
            echo '> Wings cannot pull a private package without registry credentials.'
            echo
            echo 'Egg `docker_images` block:'
            echo '```json'
            echo '{'
            # Newest first: Pterodactyl preselects the first image in this list
            # when a server is created, and the egg defaults install the newest
            # Minecraft, which needs the newest Java.
            for t in 25 21 17 17j9 16 11 8 8j9; do
              case "$t" in
                *j9) label="Java ${t%j9} (OpenJ9)" ;;
                *)   label="Java $t" ;;
              esac
              comma=","; [ "$t" = "8j9" ] && comma=""
              echo "    \"$label\": \"${{ needs.prepare.outputs.image }}:java_$t\"$comma"
            done
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
